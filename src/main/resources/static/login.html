<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spring MVC Example - Login</title>
</head>
<body>
<h2>Iniciar Sesión</h2>
<form action="/login" method="post">
    <p>Usuario:<input type="text" name="username" placeholder="Ingresa tu usuario"></p>
    <p>Contraseña:<input type="password" name="password" placeholder="Ingresa tu contraseña"></p>
    <p><input type="submit" value="Iniciar Sesión"></p>
</form>
</body>
</html>
